name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tests
        run: uv run --with pytest pytest -q
      - name: Lint
        run: uvx ruff check bin/ tests/
      - name: Type check
        # Exit codes drift between basedpyright releases; the gate is the
        # summary line (errors must be zero — warnings are informational at
        # the JSON boundary and `warnings = false` is set in pyproject.toml).
        run: |
          set +e
          uvx basedpyright==1.40.0 bin/ > pyright.txt 2>&1
          set -e
          tail -5 pyright.txt
          grep -qE "^0 errors" pyright.txt

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qmllint and QML modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window
      - name: Fetch Omarchy shell sources
        run: git clone --depth 1 https://github.com/omacom/omarchy /tmp/omarchy
      - name: Lint QML
        # Real findings are always positioned (file:line:col); import-
        # resolution banners ("Failed to import Quickshell", missing
        # builtins) are environment noise — Quickshell has no Ubuntu
        # package and qs.* needs the Quickshell runtime. Exit code is
        # unreliable: shell-importing files exit 255 even when clean.
        run: |
          set +e
          /usr/lib/qt6/bin/qmllint \
            -I /usr/lib/x86_64-linux-gnu/qt6/qml \
            -I /tmp/omarchy/shell \
            Panel.qml Model.js > lint.txt 2>&1
          set -e
          cat lint.txt
          grep -E "(Panel\.qml|Model\.js):[0-9]+:[0-9]+:" lint.txt \
            | grep -vi "was not found" > findings.txt || true
          if grep -Eiq "warning|error" findings.txt; then
            echo "::error::qmllint reported findings"
            exit 1
          fi
