name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tests
        run: uv run --with pytest pytest -q
      - name: Lint
        run: uvx ruff check bin/ tests/
      - name: Type check
        # Pinned: exit-code semantics for warnings have shifted between
        # basedpyright releases; 1.40.0 matches the verified local run
        # (errors-only exit with `warnings = false` in pyproject.toml).
        run: uvx basedpyright==1.40.0 bin/

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qmllint and QML modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window
      - name: Fetch Omarchy shell sources
        run: git clone --depth 1 https://github.com/omacom/omarchy /tmp/omarchy
      - name: Lint QML
        # Stock modules resolve via the distro QML path and qs.* via the
        # Omarchy shell clone; Quickshell's own types have no Ubuntu package,
        # so import-resolution notices are expected and the gate is on
        # every other printed finding. (Exit code is unreliable: shell-
        # importing files exit 255 even when clean.)
        run: |
          set +e
          /usr/lib/qt6/bin/qmllint \
            -I /usr/lib/x86_64-linux-gnu/qt6/qml \
            -I /tmp/omarchy/shell \
            Panel.qml Model.js > lint.txt 2>&1
          set -e
          cat lint.txt
          grep -vi "was not found. did you add all import paths" lint.txt > findings.txt || true
          if grep -Eiq "warning|error" findings.txt; then
            echo "::error::qmllint reported findings"
            exit 1
          fi
