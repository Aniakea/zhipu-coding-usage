name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tests
        run: uv run --with pytest pytest -q
      - name: Lint
        run: uvx ruff check bin/ tests/
      - name: Type check
        # Exit codes drift between basedpyright releases; the gate is the
        # summary line (errors must be zero — warnings are informational at
        # the JSON boundary and `warnings = false` is set in pyproject.toml).
        run: |
          set +e
          uvx basedpyright==1.40.0 bin/ > pyright.txt 2>&1
          set -e
          tail -5 pyright.txt
          grep -qE "^0 errors" pyright.txt

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qmllint and QML modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-declarative-dev-tools \
            qml6-module-qtquick \
            qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts \
            qml6-module-qtquick-window
      - name: Fetch Omarchy shell sources
        run: git clone --depth 1 https://github.com/omacom/omarchy /tmp/omarchy
      - name: Lint QML
        # Without Quickshell (no Ubuntu package) every semantic check is
        # resolution noise: imports, inheritance cycles, anchors/easing
        # scopes, unresolved names. This job is therefore a syntax smoke
        # test — parse-level errors only. Semantic QML checks run locally
        # against the packaged Omarchy shell, where qmllint is clean.
        run: |
          set +e
          /usr/lib/qt6/bin/qmllint \
            -I /usr/lib/x86_64-linux-gnu/qt6/qml \
            -I /tmp/omarchy/shell \
            Panel.qml Model.js > lint.txt 2>&1
          set -e
          cat lint.txt
          if grep -E ": error:" lint.txt; then
            echo "::error::qmllint reported parse errors"
            exit 1
          fi
