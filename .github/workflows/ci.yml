name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Tests
        run: uv run --with pytest pytest -q
      - name: Lint
        run: uvx ruff check bin/ tests/
      - name: Type check
        run: uvx basedpyright bin/

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qt6-declarative-dev-tools
      - name: Fetch Omarchy shell sources
        run: git clone --depth 1 https://github.com/omacom/omarchy /tmp/omarchy
      - name: Lint QML
        # Shell-importing QML files exit 255 even when clean (observed on
        # packaged Omarchy too), so the gate is printed findings, not the
        # exit code.
        run: |
          set +e
          /usr/lib/qt6/bin/qmllint -I /tmp/omarchy/shell Panel.qml Model.js > lint.txt 2>&1
          set -e
          cat lint.txt
          if grep -Eiq "warning|error" lint.txt; then
            echo "::error::qmllint reported findings"
            exit 1
          fi
