[tool.pytest.ini_options]
python_functions = ["Test_*"]
testpaths = ["tests"]

[tool.basedpyright]
extraPaths = ["bin"]
# Exit code reflects errors only; the JSON-boundary Unknown-type warnings
# are informational at any strictness level.
warnings = false

# Peak-hour classification and chart buckets are local wall time by design
# (ADR-0008); naive datetimes there are intentional.
[tool.ruff.lint.per-file-ignores]
"bin/zhipu_insights.py" = ["DTZ001", "DTZ007"]
"bin/zhipu_history.py" = ["DTZ005"]
"tests/test_collector.py" = ["DTZ001"]
